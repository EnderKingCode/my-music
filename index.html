<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Music">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>My Music</title>
<style>
:root{--accent:#7c5cff;--bg:#fff;--bg2:#f2f2f7;--fg:#000;--fg2:rgba(60,60,67,.62);--sep:rgba(60,60,67,.2);--bar:rgba(250,250,250,.8);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--bg2:#1c1c1e;--fg:#fff;--fg2:rgba(235,235,245,.6);--sep:rgba(84,84,88,.55);--bar:rgba(28,28,30,.8)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
.ic{display:inline-flex;width:24px;height:24px}.ic svg{width:100%;height:100%;fill:currentColor}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#col{order:1;flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#main{flex:1;min-height:0;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:30px;background:var(--bg)}
.page.push{animation:pushin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes pushin{from{transform:translateX(28%);opacity:.2}to{transform:none;opacity:1}}
.nav{position:sticky;top:0;z-index:5;height:calc(48px + var(--st));padding:var(--st) 12px 0;display:flex;align-items:center;justify-content:space-between;background:transparent;transition:background .2s}
.nav::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.5px;background:var(--sep);opacity:0;transition:opacity .2s}
.nav.on{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.nav.on::after{opacity:1}
.nav .back{color:var(--accent);display:flex;align-items:center;font-size:17px;min-width:70px;gap:2px}
.nav .back .ic{width:22px;height:22px;margin-left:-6px}
.nav-title{position:absolute;left:80px;right:80px;text-align:center;font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.on .nav-title{opacity:1}
.nav-right{min-width:70px;display:flex;justify-content:flex-end;color:var(--accent)}
.nav-right button{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
h1.large{font-size:34px;font-weight:700;letter-spacing:.2px;margin:0 20px 8px}
h2.sec{font-size:22px;font-weight:700;margin:22px 20px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sub{margin:0 20px 10px;color:var(--fg2);font-size:15px}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:6px 16px 6px 20px;min-height:60px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 60px}
.row:active{background:var(--bg2)}
.row::after{content:"";position:absolute;left:20px;right:0;bottom:0;height:.5px;background:var(--sep)}
.row.song::after{left:76px}
.row .meta{flex:1;min-width:0}
.t1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:14px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row.playing .t1{color:var(--accent)}
.row .num{width:44px;text-align:center;color:var(--fg2);font-size:17px;flex:none}
.row.playing .num{color:var(--accent)}
.row .more{width:36px;height:36px;color:var(--fg2);display:flex;align-items:center;justify-content:center;flex:none;margin-right:-6px}
.favdot{color:var(--accent);width:14px;height:14px;display:flex;flex:none}.favdot .ic{width:14px;height:14px}
.menu-row{padding:10px 20px;min-height:52px}
.menu-row .lead{color:var(--accent);width:30px;flex:none;display:flex;justify-content:center}
.menu-row .chev{color:var(--fg2);width:20px;height:20px;display:flex}.menu-row .chev .ic{width:20px;height:20px}
.menu-row .t1{font-size:20px;color:var(--accent)}
.menu-row.plain .t1{color:var(--fg)}
.art{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 55% 62%),hsl(calc(var(--h) + 40) 60% 38%));flex:none;box-shadow:0 0 0 .5px rgba(0,0,0,.12)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75)}
.art .ph .ic{width:42%;height:42%}
.art.has .ph{display:none}
.art.sm{width:44px;border-radius:5px}
.art.md{width:54px}
.art.round{border-radius:50%}
.art.card{width:100%;border-radius:9px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px;padding:0 20px}
.cell{cursor:pointer;min-width:0}.cell:active{opacity:.7}
.cell .t1{font-size:15px;margin-top:8px;font-weight:500}.cell .t2{font-size:15px;margin-top:0}
.hdr{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 40px 0}
.hdr .art{width:min(62vw,280px);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.hdr .name{font-size:22px;font-weight:700;margin-top:16px}
.hdr .by{color:var(--accent);font-size:22px;margin-top:2px}
.hdr .info{color:var(--fg2);font-size:13px;margin-top:4px;text-transform:uppercase;letter-spacing:.2px}
.pills{display:flex;gap:12px;padding:18px 20px 10px}
.pill{flex:1;background:var(--bg2);color:var(--accent);font-weight:600;font-size:17px;border-radius:12px;padding:13px;display:flex;gap:8px;align-items:center;justify-content:center}
.pill:active{opacity:.6}.pill .ic{width:20px;height:20px}
.letter{position:sticky;top:calc(48px + var(--st));z-index:2;padding:4px 20px;font-weight:700;font-size:18px;background:var(--bg)}
.rail{position:fixed;right:2px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;color:var(--accent);padding:6px 4px;touch-action:none;line-height:1.28}
.rail span{padding:0 4px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 36px;color:var(--fg2);gap:10px}
.empty .big{width:70px;height:70px;color:var(--accent);opacity:.9}.empty .big .ic{width:70px;height:70px}
.empty h3{margin:6px 0 0;font-size:22px;color:var(--fg)}
.empty p{margin:0;font-size:16px;line-height:1.4;max-width:300px}
.cta{margin-top:14px;background:var(--accent);color:#fff;font-weight:600;border-radius:12px;padding:13px 28px;font-size:17px}
.search-box{margin:0 16px 8px;position:sticky;top:calc(48px + var(--st));z-index:3;background:var(--bg);padding:4px 0}
.search-box div{display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:11px;padding:0 10px;height:38px;color:var(--fg2)}
.search-box .ic{width:18px;height:18px}
.search-box input{flex:1;background:none;border:0;outline:0;color:var(--fg);font-size:17px;min-width:0;-webkit-user-select:text;user-select:text}
#tabbar{order:2;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-top:.5px solid var(--sep);padding:6px 0 calc(4px + var(--sb));z-index:10}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--fg2);padding:2px 0}
#tabbar button.on{color:var(--accent)}
#tabbar .ic{width:26px;height:26px}
#mini{display:none;align-items:center;gap:12px;margin:0 10px 6px;padding:8px 10px;border-radius:14px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);box-shadow:0 2px 14px rgba(0,0,0,.18),0 0 0 .5px var(--sep);cursor:pointer;position:relative;z-index:9}
#mini.on{display:flex}
#mini .art{width:42px;border-radius:6px}
#mini .mt{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini button{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
#mini button .ic{width:26px;height:26px}
@media (min-width:820px){
 #app{flex-direction:row}
 #tabbar{order:0;flex-direction:column;width:230px;padding:calc(24px + var(--st)) 12px 20px;border-top:0;border-right:.5px solid var(--sep);justify-content:flex-start;gap:2px;background:var(--bg2)}
 #tabbar button{flex:none;flex-direction:row;gap:12px;font-size:17px;padding:9px 12px;border-radius:9px}
 #tabbar button.on{background:rgba(120,120,128,.18)}
 #tabbar .ic{width:22px;height:22px}
}
/* player sheet */
#player{position:fixed;inset:0;z-index:50;transform:translateY(102%);transition:transform .45s cubic-bezier(.2,.85,.25,1);display:flex;flex-direction:column;color:#fff;background:#222;overflow:hidden;touch-action:none;visibility:hidden}
#player.open{transform:none;visibility:visible}
#player.drag{transition:none}
#pbg{position:absolute;inset:-20%;background-size:cover;background-position:center;filter:blur(70px) saturate(1.6);opacity:.75;transform:scale(1.2)}
#pshade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.45))}
.pcol{position:relative;flex:1;display:flex;flex-direction:column;width:100%;max-width:560px;margin:0 auto;padding:calc(var(--st) + 8px) 28px calc(var(--sb) + 18px);min-height:0}
.pgrab{align-self:center;width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);margin:2px 0 12px;flex:none}
#pcover{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px 0}
#partwrap{width:100%;max-width:min(100%,52vh);transform:scale(.82);transition:transform .5s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 20px 60px rgba(0,0,0,.45);border-radius:10px}
#partwrap.playing{transform:scale(1)}
#partwrap .art{width:100%;border-radius:10px;box-shadow:none}
#pqueue{display:none;flex:1;min-height:0;overflow-y:auto;margin:0 -12px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#player.showq #pqueue{display:block}#player.showq #pcover{display:none}
#pqueue .qh{font-weight:700;font-size:20px;padding:6px 12px 8px}
#pqueue .qr{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:10px}
#pqueue .qr.cur{background:rgba(255,255,255,.14)}
#pqueue .qr .meta{flex:1;min-width:0}
#pqueue .t1{font-size:16px}#pqueue .t2{color:rgba(255,255,255,.65);font-size:13px}
#pqueue .qr button{width:34px;height:34px;color:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center}
#pqueue .art{width:44px}
.pinfo{display:flex;align-items:center;gap:8px;margin-top:8px;flex:none}
.ptext{flex:1;min-width:0}
#ptitle{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#partist{font-size:20px;color:rgba(255,255,255,.68);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pinfo button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
.pinfo button .ic{width:20px;height:20px}
.pinfo button.fav.on{color:#fff}
.pseek{margin-top:18px;flex:none}
.seek{height:22px;display:flex;align-items:center;touch-action:none;cursor:pointer}
.seek .track{position:relative;flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.28);transition:height .15s}
.seek.drag .track{height:11px}
.seek .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:rgba(255,255,255,.85);width:0}
.times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums;margin-top:2px}
.pctl{display:flex;align-items:center;justify-content:center;gap:34px;margin:14px 0 8px;flex:none}
.pctl button{width:64px;height:64px;display:flex;align-items:center;justify-content:center}
.pctl button .ic{width:40px;height:40px}
.pctl button.play .ic{width:58px;height:58px}
.pctl button:active{opacity:.6;transform:scale(.92)}
.pbottom{display:flex;justify-content:space-between;padding:6px 18px 0;flex:none}
.pbottom button{width:48px;height:44px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.65);border-radius:10px}
.pbottom button.on{background:rgba(255,255,255,.9);color:#222}
.pbottom button .ic{width:24px;height:24px}
/* sheets & dialogs */
#scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.85,.25,1);padding:8px 0 calc(var(--sb) + 10px);max-height:82vh;overflow-y:auto;max-width:560px;margin:0 auto}
#sheet.on{transform:none}
#sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 8px}
#sheet .sh-title{padding:4px 20px 10px;border-bottom:.5px solid var(--sep);display:flex;gap:12px;align-items:center}
#sheet .row::after{left:20px}
#sheet .danger .t1,#sheet .danger .lead{color:#ff3b30}
#sheet .disabled{opacity:.35;pointer-events:none}
#dialog{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4)}
#dialog.on{display:flex}
.dlg{width:min(86vw,300px);background:var(--bar);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;text-align:center;overflow:hidden;color:var(--fg);box-shadow:0 10px 40px rgba(0,0,0,.4)}
:root:not(.x) .dlg{background:var(--bg2)}
.dlg .body{padding:18px 16px 14px}
.dlg h4{margin:0 0 4px;font-size:17px}.dlg p{margin:0;font-size:13px;color:var(--fg2)}
.dlg input{margin-top:12px;width:100%;padding:8px 10px;border-radius:8px;border:.5px solid var(--sep);background:var(--bg);color:var(--fg);font-size:16px;outline:0;-webkit-user-select:text;user-select:text}
.dlg .btns{display:flex;border-top:.5px solid var(--sep)}
.dlg .btns button{flex:1;padding:12px;font-size:17px;color:var(--accent)}
.dlg .btns button+button{border-left:.5px solid var(--sep);font-weight:600}
.dlg .btns .danger{color:#ff3b30}
.bar{height:6px;border-radius:3px;background:var(--sep);overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#toast{position:fixed;left:50%;top:calc(var(--st) + 54px);transform:translate(-50%,-14px);background:rgba(40,40,40,.92);color:#fff;padding:10px 18px;border-radius:22px;font-size:15px;z-index:100;opacity:0;pointer-events:none;transition:.25s;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 20px;min-height:52px;cursor:pointer;position:relative}
.set-row::after{content:"";position:absolute;left:20px;right:0;bottom:0;height:.5px;background:var(--sep)}
.set-row .t1{flex:1}.set-row .v{color:var(--fg2);font-size:16px}
.set-row.accent .t1{color:var(--accent)}
.foot{padding:10px 20px;color:var(--fg2);font-size:13px;line-height:1.4}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;width:16px}
.eq i{width:3px;background:var(--accent);animation:eq .9s infinite ease-in-out;height:30%}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
/* iPhone Home Screen apps: make sure full-screen parts reach the very bottom edge */
html{background:var(--bg)}
#app,#player{bottom:auto;height:100vh}
@supports (height:100lvh){#app,#player{height:100lvh}}
</style>
</head>
<body>
<div id="app">
  <div id="col"><div id="main"></div><div id="mini"></div></div>
  <nav id="tabbar"></nav>
</div>
<div id="player"></div>
<div id="scrim"></div><div id="sheet"></div><div id="dialog"></div><div id="toast"></div>
<input type="file" id="fileIn" multiple accept="audio/*,.mp3,.m4a,.aac,.wav,.flac" hidden>
<input type="file" id="dirIn" webkitdirectory multiple hidden>
<script>
'use strict';
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.style.cssText = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(3)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const coll = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
const cmp = (a, b) => coll.compare(a || '', b || '');
const sortName = s => (s || '').replace(/^(the|a|an)\s+/i, '');
function fmt(s) {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  const m = Math.floor(s / 60), sec = s % 60;
  if (m >= 60) return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  return m + ':' + String(sec).padStart(2, '0');
}
function hash(str) {
  let x = 5381;
  for (let i = 0; i < str.length; i++) x = ((x << 5) + x + str.charCodeAt(i)) | 0;
  return (x >>> 0).toString(36);
}
const hueOf = str => parseInt(hash(str || 'x'), 36) % 360;
const letterOf = s => {
  const c = sortName(s).trim().charAt(0).toUpperCase();
  return /[A-Z]/.test(c) ? c : '#';

const sleep = ms => new Promise(r => setTimeout(r, ms));
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

/* ================= icons ================= */
const ST = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {

  pause: '<rect x="5.5" y="4" width="4.6" height="16" rx="1.2"/><rect x="13.9" y="4" width="4.6" height="16" rx="1.2"/>',

  prev: '<path d="M21.5 6.2v11.6a.8.8 0 0 1-1.2.7L12 13.3v4.5a.8.8 0 0 1-1.2.7l-9.3-5.8a.8.8 0 0 1 0-1.4l9.3-5.8a.8.8 0 0 1 1.2.7v4.5l8.3-5.2a.8.8 0 0 1 1.2.7z"/>',

const S = {
  tracks: [], byId: new Map(), albums: [], albumByKey: new Map(), artists: [], artistByName: new Map(), songs: [],

  queue: [], queueOrig: [], qi: -1, shuffle: false, repeat: 0, q: '',
  tab: 'lib', stacks: { lib: [], albums: [], songs: [], artists: [], search: [] },
};
let main;

function rebuild() {
  S.byId = new Map(S.tracks.map(t => [t.id, t]));
  S.keys = new Set(S.tracks.map(t => t.key));
  const albums = new Map(), artists = new Map();
  for (const t of S.tracks) {
    let a = albums.get(t.albumKey);
    if (!a) { a = { key: t.albumKey, name: t.album, artist: t.albumArtist || t.artist, artKey: null, tracks: [], added: 0, year: '' }; albums.set(t.albumKey, a); }
    a.tracks.push(t); a.added = Math.max(a.added, t.addedAt || 0);
    if (!a.artKey && t.artKey) a.artKey = t.artKey;
    if (!a.year && t.year) a.year = t.year;
    const an = a.artist;
    let ar = artists.get(an.toLowerCase());
    if (!ar) { ar = { name: an, tracks: [], albums: new Set(), artKey: null }; artists.set(an.toLowerCase(), ar); }
    ar.tracks.push(t); ar.albums.add(a);
    if (!ar.artKey && t.artKey) ar.artKey = t.artKey;
  }
  for (const a of albums.values())
    a.tracks.sort((x, y) => (x.disc || 1) - (y.disc || 1) || (x.track || 999) - (y.track || 999) || cmp(x.title, y.title));
  S.albums = [...albums.values()].sort((a, b) => cmp(sortName(a.name), sortName(b.name)));
  S.albumByKey = albums;
  S.artists = [...artists.values()].sort((a, b) => cmp(sortName(a.name), sortName(b.name)));
  S.artistByName = artists;
  for (const ar of S.artists) ar.tracks.sort((x, y) => cmp(x.title, y.title));
  S.songs = [...S.tracks].sort((a, b) => cmp(sortName(a.title), sortName(b.title)));
}

  S.tracks = await idbAll('tracks');
  S.playlists = await idbAll('playlists');
  S.artKeys = new Set(await idbKeys('art'));
  rebuild();
}

/* ================= importing music ================= */
let importing = null;
async function importFiles(fileList) {
  if (importing) { toast('Already adding songs…'); return; }
  const files = [...fileList].filter(f => AUDIO_EXT.test(f.name) || (f.type || '').startsWith('audio/'));
  if (!files.length) { toast('No music files found'); return; }
  try { await navigator.storage?.persist?.(); } catch (e) { }
  let lock = null;
  try { lock = await navigator.wakeLock?.request('screen'); } catch (e) { }
  importing = { cancel: false };
  const dlg = progressDialog(files.length);
  let added = 0, skipped = 0, failed = 0, full = false;
  for (let i = 0; i < files.length; i++) {
    if (importing.cancel) break;
    const f = files[i];
    dlg.update(i, f.name, added);
    try {
      const r = await importOne(f);
      if (r === 'dup') skipped++; else added++;
    } catch (e) {
      console.warn('import failed', f.name, e);
      failed++;
      if (e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''))) { full = true; break; }
    }
    if (i % 25 === 24) { rebuild(); invalidate(); await sleep(0); }
  }
  dlg.close();
  importing = null;
  try { lock?.release(); } catch (e) { }
  rebuild(); invalidate(); renderNow();
  let msg = `Added ${plural(added, 'song')}`;
  if (skipped) msg += `, ${skipped} already in library`;
  if (failed) msg += `, ${failed} could not be added`;
  if (full) msg = `Phone storage is full. ` + msg;
  toast(msg, 4000);
}

  if (S.keys.has(key)) return 'dup';
  const m = await readMeta(file);
  const t = {
    key, title: m.title, artist: m.artist, albumArtist: m.albumArtist, album: m.album, track: m.track, disc: m.disc,
    year: m.year, genre: m.genre, duration: m.duration, size: file.size, name: file.name,
    type: file.type || guessType(file.name), addedAt: Date.now(), fav: 0, artKey: null,
  };
  t.albumKey = albumKeyOf(t);
  let artBlob = null;
  const artKey = 'a' + hash(t.albumKey);
  if (S.artKeys.has(artKey)) t.artKey = artKey;
  else if (m.pic) {
    try { artBlob = await makeThumb(m.pic); if (artBlob) t.artKey = artKey; } catch (e) { }
  }
  const id = await tx(['tracks', 'blobs', 'art'], 'readwrite', x => {
    const rq = x.objectStore('tracks').add(t);
    rq.onsuccess = () => x.objectStore('blobs').put(file, rq.result);
    if (artBlob) x.objectStore('art').put(artBlob, artKey);

  if (artBlob) for (const o of S.tracks) if (o.albumKey === t.albumKey && !o.artKey) { o.artKey = artKey; idbPut('tracks', o); }
  S.tracks.push(t); S.keys.add(key);

        h('div', { class: 'meta' }, h('div', { class: 't1' }, p.name), h('div', { class: 't2' }, plural(p.tracks.length, 'song'))),
        h('span', { class: 'chev', style: 'color:var(--fg2);display:flex' }, icon('chevR')));
    })]);
}
function viewPlaylist(id) {
  const p = S.playlists.find(x => x.id === id);
  if (!p) return page('Playlist', [emptyState('Playlist not found', 'It may have been deleted.', false)]);
  const list = p.tracks.map(i => S.byId.get(i)).filter(Boolean);
  const ids = () => p.tracks.filter(i => S.byId.has(i));
  const menu = () => sheet([
    { label: 'Rename', icon: 'edit', run: () => askText('Rename Playlist', '', p.name, v => { p.name = v; idbPut('playlists', p); invalidate(); }) },
    { label: 'Delete Playlist', icon: 'trash', danger: true, run: () => confirmBox('Delete this playlist?', 'The songs stay in your library.', 'Delete', async () => {
      await idbDel('playlists', p.id); S.playlists = S.playlists.filter(x => x !== p); pop(); invalidate();
    }) },
  ], p.name);
  return page(p.name, [
    h('div', { class: 'hdr' }, artEl(list[0]?.artKey, '', 'pl' + p.id), h('div', { class: 'name' }, p.name), h('div', { class: 'info' }, plural(list.length, 'song'))),
    list.length ? [pills(ids), list.map((t, i) => songRow(t, ids, i, { playlist: p }))]
      : h('div', { class: 'empty' }, h('p', null, 'Tap ••• next to any song and choose "Add to Playlist".')),
  ], { right: h('button', { 'aria-label': 'Playlist options', onclick: menu }, icon('more')), at: 300 });
}
function viewSearch() {
  const results = h('div');
  const input = h('input', { type: 'search', placeholder: 'Songs, albums, artists', value: S.q, autocomplete: 'off', autocorrect: 'off', spellcheck: 'false' });
  const run = () => {
    S.q = input.value;
    const q = S.q.trim().toLowerCase();
    results.replaceChildren();
    if (!q) { results.append(h('div', { class: 'empty' }, h('div', { class: 'big' }, icon('search')), h('p', null, 'Search your library.'))); return; }
    const has = s => (s || '').toLowerCase().includes(q);
    const ar = S.artists.filter(a => has(a.name)).slice(0, 6);
    const al = S.albums.filter(a => has(a.name) || has(a.artist)).slice(0, 8);
    const so = S.songs.filter(t => has(t.title) || has(t.artist) || has(t.album)).slice(0, 80);
    const ids = () => so.map(t => t.id);
    if (ar.length) results.append(h('h2', { class: 'sec' }, 'Artists'), ...ar.map(a => h('div', { class: 'row', onclick: () => push(() => viewArtist(a.name)) },
      artEl(a.artKey, 'md round', a.name), h('div', { class: 'meta' }, h('div', { class: 't1' }, a.name), h('div', { class: 't2' }, 'Artist')))));
    if (al.length) results.append(h('h2', { class: 'sec' }, 'Albums'), h('div', { class: 'grid' }, al.map(albumCell)));
    if (so.length) results.append(h('h2', { class: 'sec' }, 'Songs'), ...so.map((t, i) => songRow(t, ids, i)));
    if (!ar.length && !al.length && !so.length) results.append(h('div', { class: 'empty' }, h('h3', null, 'No results'), h('p', null, 'Try a different word.')));
  };
  input.addEventListener('input', run);
  run();
  return page('Search', [h('h1', { class: 'large' }, 'Search'),
    h('div', { class: 'search-box' }, h('div', null, icon('search'), input)), results], { back: false });
}
function viewSettings() {
  const stats = h('span', { class: 'v' }, '…');
  navigator.storage?.estimate?.().then(e => {
    const gb = x => (x / 1e9).toFixed(x > 1e10 ? 0 : 1) + ' GB';
    stats.textContent = `${gb(e.usage || 0)} used of ${gb(e.quota || 0)}`;
  }).catch(() => { stats.textContent = 'unknown'; });
  const total = S.tracks.reduce((s, t) => s + (t.size || 0), 0);
  return page('Settings', [h('h1', { class: 'large' }, 'Settings'),
    h('div', { class: 'set-row accent', onclick: () => pickFiles() }, h('span', { class: 'lead', style: 'color:var(--accent);display:flex' }, icon('plus')), h('div', { class: 't1' }, 'Add Songs')),
    h('div', { class: 'set-row accent', onclick: () => pickFolder() }, h('span', { class: 'lead', style: 'color:var(--accent);display:flex' }, icon('folder')), h('div', { class: 't1' }, 'Add a Whole Folder')),
    h('div', { class: 'foot' }, 'Songs are copied into this app, so they keep playing without internet. Songs you already added are skipped. Keep the screen on while a big folder is being added.'),
    h('h2', { class: 'sec' }, 'Library'),
    h('div', { class: 'set-row' }, h('div', { class: 't1' }, 'Songs'), h('span', { class: 'v' }, S.tracks.length)),
    h('div', { class: 'set-row' }, h('div', { class: 't1' }, 'Albums'), h('span', { class: 'v' }, S.albums.length)),
    h('div', { class: 'set-row' }, h('div', { class: 't1' }, 'Music size'), h('span', { class: 'v' }, (total / 1e9).toFixed(2) + ' GB')),
    h('div', { class: 'set-row' }, h('div', { class: 't1' }, 'Storage'), stats),
    h('div', { class: 'set-row', onclick: () => confirmBox('Remove all songs?', 'This deletes every song, playlist and favorite from this app. Your files in the Files app are not touched.', 'Remove All', async () => {
      stopPlayback(); await deleteTracks(S.tracks.map(t => t.id));
      for (const p of S.playlists) await idbDel('playlists', p.id); S.playlists = []; invalidate(); toast('Library is empty');
    }) }, h('div', { class: 't1', style: 'color:#ff3b30' }, 'Remove All Songs')),
  ]);
}

/* ================= menus, dialogs, toast ================= */
function trackMenu(t, playlist) {
  sheet([
    { label: 'Play Next', icon: 'playNext', run: () => playNext(t) },
    { label: 'Add to Queue', icon: 'queueEnd', run: () => addToQueue(t) },
    { label: t.fav ? 'Remove from Favorites' : 'Add to Favorites', icon: t.fav ? 'heart' : 'heartO', run: () => toggleFav(t) },
    { label: 'Add to Playlist…', icon: 'playlist', run: () => addToPlaylist(t) },
    playlist ? { label: 'Remove from This Playlist', icon: 'x', run: () => { const i = playlist.tracks.indexOf(t.id); if (i >= 0) { playlist.tracks.splice(i, 1); idbPut('playlists', playlist); invalidate(); } } } : null,
    { label: 'Go to Album', icon: 'album', run: () => { goTab('albums'); push(() => viewAlbum(t.albumKey)); } },
    { label: 'Go to Artist', icon: 'mic', run: () => { goTab('artists'); push(() => viewArtist(t.albumArtist || t.artist)); } },
    { label: 'Delete from Library', icon: 'trash', danger: true, run: () => confirmBox('Delete this song?', 'It is removed from this app only.', 'Delete', () => deleteTracks([t.id])) },
  ].filter(Boolean), t);
}
function toggleFav(t) {
  t.fav = t.fav ? 0 : 1; idbPut('tracks', t);
  toast(t.fav ? 'Added to Favorites' : 'Removed from Favorites');
  invalidate(); renderNow();
}
function addToPlaylist(t) {
  sheet([
    { label: 'New Playlist…', icon: 'plus', run: () => newPlaylist(t) },
    ...S.playlists.map(p => ({ label: p.name, icon: 'playlist', run: () => {
      p.tracks.push(t.id); idbPut('playlists', p); toast(`Added to "${p.name}"`); invalidate();
    } })),
  ], 'Add to Playlist');
}
function newPlaylist(t) {
  askText('New Playlist', 'Give it a name.', '', async name => {
    const p = { name, tracks: t ? [t.id] : [], created: Date.now() };
    p.id = await idbPut('playlists', p);
    S.playlists.push(p); invalidate();
    toast(t ? `Added to "${name}"` : 'Playlist made');
  });
}
function sheet(items, head) {
  const sh = $('#sheet'), scrim = $('#scrim');
  const close = () => { sh.classList.remove('on'); scrim.classList.remove('on'); };
  let title = null;
  if (head && typeof head === 'object') title = h('div', { class: 'sh-title' }, artEl(head.artKey, 'sm', head.albumKey),
    h('div', { class: 'meta', style: 'min-width:0' }, h('div', { class: 't1', style: 'font-weight:600' }, head.title), h('div', { class: 't2' }, head.artist)));
  else if (head) title = h('div', { class: 'sh-title', style: 'font-weight:600;font-size:17px' }, head);
  sh.replaceChildren(...[h('div', { class: 'grab' }), title, ...items.map(it =>
    h('div', { class: 'row menu-row plain' + (it.danger ? ' danger' : ''), onclick: () => { close(); setTimeout(it.run, 120); } },
      h('div', { class: 'meta' }, h('div', { class: 't1', style: 'font-size:17px' }, it.label)), h('span', { class: 'lead' }, icon(it.icon))))].filter(Boolean));
  scrim.onclick = close;
  requestAnimationFrame(() => { sh.classList.add('on'); scrim.classList.add('on'); });
}
function dialog(build) {
  const d = $('#dialog');
  const close = () => { d.classList.remove('on'); d.replaceChildren(); };
  d.replaceChildren(build(close)); d.classList.add('on');
  return close;
}
function askText(title, text, initial, done) {
  dialog(close => {
    const inp = h('input', { type: 'text', value: initial || '', placeholder: 'Name' });
    const ok = () => { const v = inp.value.trim(); if (!v) return; close(); done(v); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
    setTimeout(() => inp.focus(), 50);
    return h('div', { class: 'dlg' }, h('div', { class: 'body' }, h('h4', null, title), text ? h('p', null, text) : null, inp),
      h('div', { class: 'btns' }, h('button', { onclick: close }, 'Cancel'), h('button', { onclick: ok }, 'Save')));
  });
}
function confirmBox(title, text, okLabel, done) {
  dialog(close => h('div', { class: 'dlg' }, h('div', { class: 'body' }, h('h4', null, title), h('p', null, text)),
    h('div', { class: 'btns' }, h('button', { onclick: close }, 'Cancel'), h('button', { class: 'danger', onclick: () => { close(); done(); } }, okLabel))));
}
function progressDialog(total) {
  let bar, line, count;
  const close = dialog(() => {
    bar = h('i'); line = h('p', { style: 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis' }, ''); count = h('h4', null, 'Adding songs…');
    return h('div', { class: 'dlg' }, h('div', { class: 'body' }, count, h('div', { class: 'bar' }, bar), line,
      h('p', { style: 'margin-top:6px' }, 'Keep this app open until it finishes.')),
      h('div', { class: 'btns' }, h('button', { onclick: () => { if (importing) importing.cancel = true; } }, 'Stop')));
  });
  return {
    update(i, name) { bar.style.width = (i / total * 100) + '%'; count.textContent = `Adding songs… ${i + 1} of ${total}`; line.textContent = name; },
    close,
  };
}
let toastT;
function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}
function pickFiles() { $('#fileIn').click(); }
function pickFolder() { $('#dirIn').click(); }

/* ================= now playing: mini player + full player ================= */
const P = {};
function buildPlayer() {
  P.root = $('#player');
  P.bg = h('div', { id: 'pbg' });
  P.artwrap = h('div', { id: 'partwrap' });
  P.title = h('div', { id: 'ptitle' }); P.artist = h('div', { id: 'partist' });
  P.fav = h('button', { class: 'fav', 'aria-label': 'Favorite', onclick: () => { const t = S.byId.get(curId); if (t) toggleFav(t); } });
  P.more = h('button', { 'aria-label': 'More', onclick: () => { const t = S.byId.get(curId); if (t) trackMenu(t); } }, icon('more'));
  P.fill = h('div', { class: 'fill' });
  P.seek = h('div', { class: 'seek' }, h('div', { class: 'track' }, P.fill));
  P.tcur = h('span', null, '0:00'); P.trem = h('span', null, '-0:00');
  P.play = h('button', { class: 'play', 'aria-label': 'Play', onclick: () => togglePlay() });
  P.shuf = h('button', { 'aria-label': 'Shuffle', onclick: () => setShuffle(!S.shuffle) }, icon('shuffle'));
  P.rep = h('button', { 'aria-label': 'Repeat', onclick: () => { S.repeat = (S.repeat + 1) % 3; renderNow(); saveState(); toast(['Repeat off', 'Repeat all', 'Repeat one'][S.repeat], 1200); } });
  P.qbtn = h('button', { 'aria-label': 'Up Next', onclick: () => { P.root.classList.toggle('showq'); P.qbtn.classList.toggle('on'); renderQueue(); } }, icon('list'));
  P.queue = h('div', { id: 'pqueue' });
  P.grab = h('div', { class: 'pgrab' });
  P.root.append(P.bg, h('div', { id: 'pshade' }), h('div', { class: 'pcol' },
    P.grab, h('div', { id: 'pcover' }, P.artwrap), P.queue,
    h('div', { class: 'pinfo' }, h('div', { class: 'ptext' }, P.title, P.artist), P.fav, P.more),
    h('div', { class: 'pseek' }, P.seek, h('div', { class: 'times' }, P.tcur, P.trem)),
    h('div', { class: 'pctl' },
      h('button', { 'aria-label': 'Previous', onclick: () => prev() }, icon('prev')), P.play,
      h('button', { 'aria-label': 'Next', onclick: () => next() }, icon('next'))),
    h('div', { class: 'pbottom' }, P.shuf, P.qbtn, P.rep)));
  // seek bar
  let dragging = false;
  const frac = e => { const r = P.seek.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  const preview = f => { P.fill.style.width = f * 100 + '%'; const d = audio.duration || S.byId.get(curId)?.duration || 0; P.tcur.textContent = fmt(f * d); P.trem.textContent = '-' + fmt(d - f * d); };
  P.seek.addEventListener('pointerdown', e => { dragging = true; P.seek.classList.add('drag'); P.seek.setPointerCapture(e.pointerId); preview(frac(e)); e.stopPropagation(); });
  P.seek.addEventListener('pointermove', e => { if (dragging) preview(frac(e)); });
  const end = e => {
    if (!dragging) return; dragging = false; P.seek.classList.remove('drag');
    const f = frac(e);
    if (isFinite(audio.duration) && audio.duration > 0) audio.currentTime = f * audio.duration;
    else { restorePos = f * (S.byId.get(curId)?.duration || 0); }
  };
  P.seek.addEventListener('pointerup', end); P.seek.addEventListener('pointercancel', () => { dragging = false; P.seek.classList.remove('drag'); });
  P.isDragging = () => dragging;
  // drag the player down to close it
  let y0 = null, dy = 0;
  const startDrag = e => { if (P.root.classList.contains('showq') && e.target.closest('#pqueue')) return; y0 = e.clientY; dy = 0; };
  P.root.addEventListener('pointerdown', e => { if (e.target.closest('button,.seek')) return; startDrag(e); });
  P.root.addEventListener('pointermove', e => {
    if (y0 == null) return;
    dy = Math.max(0, e.clientY - y0);
    if (dy > 6) { P.root.classList.add('drag'); P.root.style.transform = `translateY(${dy}px)`; }
  });
  const stop = () => {
    if (y0 == null) return; y0 = null;
    P.root.classList.remove('drag'); P.root.style.transform = '';
    if (dy > 110) closePlayer();
  };
  P.root.addEventListener('pointerup', stop); P.root.addEventListener('pointercancel', stop);
  P.grab.addEventListener('click', closePlayer);
  // mini player
  P.mini = $('#mini');
  P.mArt = h('div'); P.mTitle = h('div', { class: 'mt' });
  P.mPlay = h('button', { 'aria-label': 'Play', onclick: e => { e.stopPropagation(); togglePlay(); } });
  P.mini.append(P.mArt, P.mTitle, P.mPlay, h('button', { 'aria-label': 'Next', onclick: e => { e.stopPropagation(); next(); } }, icon('next')));
  P.mini.addEventListener('click', openPlayer);
}
function openPlayer() { if (S.qi < 0) return; P.root.classList.add('open'); renderNow(); renderQueue(); }
function closePlayer() { P.root?.classList.remove('open'); }
let shownArt = null;
function renderNow() {
  if (!P.root) return;
  const id = S.qi >= 0 ? S.queue[S.qi] : null;
  const t = id != null ? S.byId.get(id) : null;
  const playing = !audio.paused && !!curUrl && curId === id;
  P.mini.classList.toggle('on', !!t);
  if (!t) return;
  if (shownArt !== t.id) {
    shownArt = t.id;
    P.mArt.replaceChildren(artEl(t.artKey, '', t.albumKey));
    P.artwrap.replaceChildren(artEl(t.artKey, '', t.albumKey));
    P.bg.style.backgroundImage = 'none';
    const hue = hueOf(t.albumKey);
    P.root.style.background = `linear-gradient(hsl(${hue} 35% 38%), hsl(${hue} 40% 16%))`;
    artURL(t.artKey).then(u => { if (u && shownArt === t.id) P.bg.style.backgroundImage = `url(${u})`; });
    artColor(t.artKey).then(c => {
      if (!c || shownArt !== t.id) return;
      const [r, g, b] = c, d = f => `rgb(${Math.round(r * f)},${Math.round(g * f)},${Math.round(b * f)})`;
      P.root.style.background = `linear-gradient(${d(.85)}, ${d(.35)})`;
    });
  }
  P.mTitle.textContent = t.title;
  P.title.textContent = t.title; P.artist.textContent = t.artist;
  P.mPlay.replaceChildren(icon(playing ? 'pause' : 'play'));
  P.play.replaceChildren(icon(playing ? 'pause' : 'play'));
  P.artwrap.classList.toggle('playing', playing);
  P.fav.replaceChildren(icon(t.fav ? 'heart' : 'heartO')); P.fav.classList.toggle('on', !!t.fav);
  P.shuf.classList.toggle('on', S.shuffle);
  P.rep.classList.toggle('on', S.repeat > 0);
  P.rep.replaceChildren(icon(S.repeat === 2 ? 'repeat1' : 'repeat'));
  document.querySelectorAll('.row.song').forEach(r => {
    const on = +r.dataset.id === curId;
    if (r.classList.contains('playing') !== on) r.classList.toggle('playing', on);
  });
  updateTime();
}
function updateTime() {
  if (!P.root || P.isDragging?.()) return;
  const t = S.byId.get(curId ?? S.queue[S.qi]);
  const d = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : (t?.duration || 0);
  const c = curUrl && curId === S.queue[S.qi] ? audio.currentTime : restorePos;
  P.fill.style.width = (d ? Math.min(1, c / d) * 100 : 0) + '%';
  P.tcur.textContent = fmt(c); P.trem.textContent = '-' + fmt(Math.max(0, d - c));
  updatePositionState();
}
function renderQueue() {
  if (!P.root || !P.root.classList.contains('showq')) return;
  const rows = [h('div', { class: 'qh' }, 'Playing Next')];
  const upcoming = S.queue.slice(S.qi);
  upcoming.slice(0, 300).forEach((id, k) => {
    const t = S.byId.get(id); if (!t) return;
    const qi = S.qi + k;
    rows.push(h('div', { class: 'qr' + (k === 0 ? ' cur' : ''), onclick: () => goTo(qi) },
      artEl(t.artKey, '', t.albumKey), h('div', { class: 'meta' }, h('div', { class: 't1' }, t.title), h('div', { class: 't2' }, t.artist)),
      k === 0 ? null : h('button', { 'aria-label': 'Remove', onclick: e => { e.stopPropagation(); S.queue.splice(qi, 1); renderQueue(); saveState(); } }, icon('x'))));
  });
  if (upcoming.length > 300) rows.push(h('div', { class: 't2', style: 'padding:10px 12px' }, `and ${upcoming.length - 300} more`));
  P.queue.replaceChildren(...rows);
}
setInterval(() => { if (P.root?.classList.contains('open') && !audio.paused) updateTime(); }, 250);

/* ================= start ================= */
async function start() {
  main = $('#main');
  const tb = $('#tabbar');
  for (const t of TABS) tb.append(h('button', { 'data-tab': t.id, onclick: () => switchTab(t.id) }, icon(t.icon), h('span', null, t.label)));
  buildPlayer();
  const onPick = e => { const f = e.target.files; if (f && f.length) importFiles(f); e.target.value = ''; };
  $('#fileIn').addEventListener('change', onPick);
  $('#dirIn').addEventListener('change', onPick);
  try { await openDB(); await loadLibrary(); }
  catch (e) { toast('Storage is not available here. Open the app from the Home Screen.', 6000); console.error(e); }
  restoreState();
  S.tab = null; switchTab('lib');
  renderNow();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
}
start();
